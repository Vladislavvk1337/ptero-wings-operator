apiVersion: gameserver.pterodactyl.io/v1alpha1
kind: GameServer
metadata:
  name: minecraft-survival
  namespace: game-servers
spec:
  classRef:
    name: minecraft-vanilla
  game:
    type: minecraft
    image: itzg/minecraft-server:latest
    env:
      - name: EULA
        value: "TRUE"
      - name: SERVER_MEMORY
        value: "1536"
      - name: SERVER_JARFILE
        value: server.jar
  runtime:
    imagePullPolicy: IfNotPresent
    startup:
      raw: java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}
      variables:
        SERVER_MEMORY: "1536"
        SERVER_JARFILE: server.jar
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  storage:
    size: 10Gi
    mountPath: /data
    deletePolicy: Retain
  network:
    serviceType: NodePort
    nodePortAllocation:
      startPort: 30005
      count: 5
      containerStartPort: 25565
  lifecycle:
    suspended: false
  external:
    externalServerId: "srv-42"
  pterodactyl:
    serverUuid: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    nodeId: 1
