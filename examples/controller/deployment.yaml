apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptero-wings-controller
  namespace: ptero-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ptero-wings-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptero-wings-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: ptero-wings-controller
      containers:
        - name: controller
          image: ghcr.io/vladislavvk1337/ptero-wings-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GAMESERVER_NS
              value: game-servers
            - name: PANEL_URL
              value: https://panel.example.com
            - name: PANEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ptero-wings-controller
                  key: panel-token
            - name: NODEPORT_MIN
              value: "30000"
            - name: NODEPORT_MAX
              value: "31000"
