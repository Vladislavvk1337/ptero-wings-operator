apiVersion: v1
kind: ServiceAccount
metadata:
  name: ptero-wings-controller
  namespace: ptero-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ptero-wings-controller
rules:
  - apiGroups: ["gameserver.pterodactyl.io"]
    resources: ["gameservers", "gameservers/status", "gameserverclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "persistentvolumeclaims", "services", "nodes"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ptero-wings-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ptero-wings-controller
subjects:
  - kind: ServiceAccount
    name: ptero-wings-controller
    namespace: ptero-system
