# permissions for end users to view gameservers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: gameserver-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: ptero-wings-operator
    app.kubernetes.io/part-of: ptero-wings-operator
    app.kubernetes.io/managed-by: kustomize
  name: gameserver-viewer-role
rules:
- apiGroups:
  - gameserver.pterodactyl.io
  resources:
  - gameservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gameserver.pterodactyl.io
  resources:
  - gameservers/status
  verbs:
  - get
