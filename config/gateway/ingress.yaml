---
# Ingress for ptero-wings-gateway.
# Requires an Ingress controller that supports TLS passthrough or TLS termination.
# Adjust the host and TLS secret to match your deployment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ptero-wings-gateway
  namespace: ptero-system
  labels:
    app.kubernetes.io/name: ptero-wings-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ptero-wings-operator
  annotations:
    # Nginx: upgrade WebSocket connections (required for /api/servers/{uuid}/ws).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
    # Optional: cert-manager automatic certificate issuance.
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wings-gateway.example.com  # Replace with your domain
      secretName: ptero-wings-gateway-tls
  rules:
    - host: wings-gateway.example.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ptero-wings-gateway
                port:
                  name: https
