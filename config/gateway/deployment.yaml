---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptero-wings-gateway
  namespace: ptero-system
  labels:
    app.kubernetes.io/name: ptero-wings-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ptero-wings-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ptero-wings-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptero-wings-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: ptero-wings-operator
    spec:
      serviceAccountName: ptero-wings-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/vladislavvk1337/ptero-wings-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
          env:
            - name: GATEWAY_ADDR
              value: ":8090"
            - name: GAMESERVER_NS
              value: "game-servers"
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ptero-wings-gateway-token
                  key: token
            - name: GATEWAY_USE_JWT
              value: "false"
            - name: PANEL_URL
              value: ""
            - name: PANEL_TOKEN
              value: ""
            - name: NODEPORT_MIN
              value: "30000"
            - name: NODEPORT_MAX
              value: "31000"
          ports:
            - name: https
              containerPort: 8090
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: ptero-wings-gateway-tls
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Secret
metadata:
  name: ptero-wings-gateway-token
  namespace: ptero-system
  labels:
    app.kubernetes.io/name: ptero-wings-gateway
    app.kubernetes.io/part-of: ptero-wings-operator
type: Opaque
data:
  token: Y2hhbmdlbWU=
